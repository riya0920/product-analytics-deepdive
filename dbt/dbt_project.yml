name: product_analytics
version: "1.0.0"
config-version: 2
profile: product_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  product_analytics:
    staging:
      +materialized: view
    marts:
      # Marts are tables: they are read repeatedly by the analysis and the memo,
      # and re-running the window functions on every read is wasted work.
      +materialized: table
